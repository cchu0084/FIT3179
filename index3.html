<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UV Index Map - Australia</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <h2>Average UV Index Map</h2>
  <div id="uvmap"></div>

  <h2>Melanoma Incidence Map</h2>
  <div id="Incidencemap"></div>

  <script type="text/javascript">
    vegaEmbed('#uvmap', 'uv-map.json').catch(console.error);
    vegaEmbed('#Incidencemap', 'Incidencemap.json').catch(console.error);
  </script>
</body>

</html>
